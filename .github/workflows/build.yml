name: Build CodeApp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build Xcode Project (Unsigned)
        run: |
          xcodebuild build \
            -project Code.xcodeproj \
            -target "Code" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # Tìm file .app trong thư mục đầu ra của SYMROOT
          find build/Release-iphoneos -maxdepth 1 -name "*.app" -exec cp -r {} Payload/ \;
          zip -qr CodeApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-IPA
          path: CodeApp.ipa
          retention-days: 7
