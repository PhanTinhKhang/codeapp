name: Build Code App (signed with free Apple ID)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15

    env:
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install fastlane
        run: gem install fastlane -NV

      - name: Download frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Fetch signing certificate & provisioning profile via match
        run: |
          fastlane match development \
            --readonly \
            --git_url "$MATCH_GIT_URL" \
            --team_id "$APPLE_TEAM_ID" \
            --app_identifier "$BUNDLE_ID"

      - name: Build & sign .ipa
        run: |
          xcodebuild \
            -project Code.xcodeproj \
            -scheme "Code App" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="match Development $BUNDLE_ID" \
            CODE_SIGN_IDENTITY="Apple Development" \
            clean archive \
            -archivePath build/Code.xcarchive

      - name: Export .ipa
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Code.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-signed-ipa
          path: build/ipa/*.ipa
          retention-days: 14
