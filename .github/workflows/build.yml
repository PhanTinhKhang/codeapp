name: Build CodeApp IPA

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Building Unsigned IPA
    runs-on: macos-14

    env:
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_HIDE_CHANGELOG: "true"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build IPA via Fastlane
        run: |
          fastlane gym \
            --project "Code.xcodeproj" \
            --scheme "Code" \
            --clean true \
            --skip_package_ipa true \
            --skip_codesigning true \
            --skip_profile_detection true \
            --derived_data_path "build" \
            --xcargs "CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO"

      - name: Package App to IPA
        run: |
          mkdir -p Payload
          find build -name "*.app" -maxdepth 3 -exec cp -r {} Payload/ \;
          zip -qr Code.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build
          path: Code.ipa
          retention-days: 7
