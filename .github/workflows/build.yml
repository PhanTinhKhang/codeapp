name: Build Code App (unsigned IPA)

on:
  workflow_dispatch: {}   # cho phép bấm "Run workflow" thủ công trên GitHub
  push:
    branches: [ main ]     # tự động build mỗi khi push lên main (xóa nếu không cần)

jobs:
  build:
    runs-on: macos-15       # macOS runner của GitHub, có sẵn Xcode

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive   # project dùng git submodules

      - name: List installed Xcode versions
        run: ls /Applications | grep Xcode

      - name: Show default Xcode & installed platforms
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Download frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: List available schemes
        run: xcodebuild -project Code.xcodeproj -list

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project Code.xcodeproj \
            -scheme "Code App" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=YES \
            -derivedDataPath build \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r CodeApp-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-unsigned-ipa
          path: CodeApp-unsigned.ipa
          retention-days: 14
